  <path d="M32 32h656v416H32z" fill="#30251b" stroke="#68513a"/>
  <text x="60" y="76" fill="#c2b9ab" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">GAME SEARCH / MINIMAX</text>
  <rect x="67" y="111" width="292" height="292" fill="#eee8dc"/>
  <path d="M164 111v292m98-292v292M67 208h292m-292 97h292" stroke="#89877f" stroke-width="3"/>
  <path d="m94 139 42 42m0-42-42 42m195 0 42 42m0-42-42 42" stroke="#9b5b32" stroke-width="8" stroke-linecap="square"/>
  <circle cx="211" cy="158" r="23" fill="none" stroke="#d18b3b" stroke-width="8"/>
  <circle cx="115" cy="255" r="23" fill="none" stroke="#d18b3b" stroke-width="8"/>
  <path d="m289 332 42 42m0-42-42 42" stroke="#9b5b32" stroke-width="8" stroke-linecap="square"/>
