  <circle cx="460" cy="270" r="10" fill="#eee8dc"/>
  <circle cx="624" cy="270" r="10" fill="#eee8dc"/>
  <circle cx="494" cy="327" r="9" fill="#c9c7c0"/>
  <circle cx="590" cy="327" r="9" fill="#f1bd72"/>
  <text x="412" y="388" fill="#c2b9ab" font-family="Arial,sans-serif" font-size="14">Evaluate. Choose. Play.</text>
