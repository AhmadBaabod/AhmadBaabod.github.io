<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img">
  <title>Illustration of a multi-disease health risk report</title>
  <desc>Three paper report cards for sleep, diabetes and heart risk, each with a risk bar, above a model-comparison strip.</desc>
  <rect width="720" height="480" fill="#211911"/>
  <path d="M32 32h656v416H32z" fill="#30251b" stroke="#68513a"/>
  <text x="60" y="76" fill="#c2b9ab" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">HEALTHLENS / RISK REPORT</text>
  <g font-family="Arial,sans-serif" font-weight="700">
    <rect x="66" y="104" width="180" height="186" fill="#eee8dc"/>
    <text x="84" y="134" fill="#665e53" font-size="12" letter-spacing="2">SLEEP</text>
    <text x="84" y="172" fill="#211d18" font-size="24">Insomnia</text>
    <rect x="84" y="196" width="144" height="10" fill="#c9c7c0"/>
    <rect x="84" y="196" width="128" height="10" fill="#9b5b32"/>
    <path d="M84 232h144M84 254h100" stroke="#c9c7c0" stroke-width="6"/>

    <rect x="270" y="104" width="180" height="186" fill="#eee8dc"/>
    <text x="288" y="134" fill="#665e53" font-size="12" letter-spacing="2">DIABETES</text>
    <text x="288" y="172" fill="#211d18" font-size="24">Elevated</text>
    <rect x="288" y="196" width="144" height="10" fill="#c9c7c0"/>
    <rect x="288" y="196" width="104" height="10" fill="#e6a14a"/>
    <path d="M288 232h144M288 254h86" stroke="#c9c7c0" stroke-width="6"/>

    <rect x="474" y="104" width="180" height="186" fill="#eee8dc"/>
    <text x="492" y="134" fill="#665e53" font-size="12" letter-spacing="2">HEART</text>
    <text x="492" y="172" fill="#211d18" font-size="24">Low risk</text>
    <rect x="492" y="196" width="144" height="10" fill="#c9c7c0"/>
    <rect x="492" y="196" width="14" height="10" fill="#89877f"/>
    <path d="M492 232h144M492 254h110" stroke="#c9c7c0" stroke-width="6"/>
  </g>
  <g>
    <rect x="66" y="318" width="588" height="82" fill="#17120e" stroke="#68513a"/>
    <rect x="86" y="336" width="310" height="9" fill="#e6a14a"/>
    <rect x="86" y="354" width="296" height="9" fill="#89877f"/>
    <rect x="86" y="372" width="282" height="9" fill="#89877f"/>
    <text x="420" y="364" fill="#c2b9ab" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">7 MODELS · BEST KEPT</text>
  </g>
  <text x="60" y="431" fill="#eee8dc" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">PREDICT / EXPLAIN / RECOMMEND</text>
  <path d="M60 444h270" stroke="#e6a14a" stroke-width="3"/>
</svg>
